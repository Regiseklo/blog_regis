name: Veille quotidienne

on:
  schedule:
    - cron: "0 5 * * *"   # tous les jours vers 6h-7h (heure de Paris)
  workflow_dispatch:       # lancement manuel depuis l'onglet Actions

permissions:
  contents: write

jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install feedparser requests

      - name: Générer la veille du jour
        run: python scripts/veille.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}

      - name: Enregistrer dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add veille
          git diff --staged --quiet || (git commit -m "Veille du $(date +%F)" && git push)